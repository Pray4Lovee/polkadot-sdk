name: quick-checks

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml

  preflight:
    needs: isdraft
    uses: ./.github/workflows/reusable-preflight.yml

  # ✅ Add this matrix job to test scripts/getting-started.sh in CI mode
  check-bootstrap-script:
    name: Run getting-started.sh CI test
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: ubuntu
            container: ubuntu
            template: minimal
            shell: bash
          - name: debian
            container: debian
            template: parachain
            shell: sh
          - name: arch
            container: archlinux
            template: solochain
            shell: sh
          - name: fedora
            container: fedora
            template: parachain
            shell: sh
          - name: opensuse
            container: opensuse/tumbleweed
            template: solochain
            shell: sh
    container: ${{ matrix.container }}:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install prerequisites
        run: |
          case "${{ matrix.name }}" in
            ubuntu|debian)
              apt update && apt install -y sudo git curl
              ;;
            arch)
              pacman -Syu --noconfirm && pacman -S --noconfirm sudo git curl
              ;;
            fedora)
              dnf install -y sudo git curl
              ;;
            opensuse)
              zypper install -y sudo git curl
              ;;
          esac

      - name: Run getting-started.sh with CI=1
        env:
          CI: "1"
        run: |
          ${{ matrix.shell }} scripts/getting-started.sh ${{ matrix.template }}

      - name: Compile node
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.template }}-template
          cargo build --release

      - name: Check binary execution
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.template }}-template
          cargo run --release -- --help

  # 🧪 Existing quick-checks below...

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight]
    container:
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Cargo fmt
        id: required
        run: cargo +nightly fmt --all -- --check
      - name: Stop workflows on fmt fail
        if: ${{ failure() && steps.required.conclusion == 'failure' && !github.event.pull_request.head.repo.fork }}
        uses: ./.github/actions/workflow-stopper
        with:
          app-id: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_ID }}
          app-key: ${{ secrets.WORKFLOW_STOPPER_RUNNER_APP_KEY }}

  # (You can keep all your existing jobs unchanged below...)
  # check-dependency-rules, check-zepter, etc.

  confirm-required-checks-quick-jobs-passed:
    runs-on: ubuntu-latest
    name: All quick checks passed
    # Add new job name to this list:
    needs:
      - fmt
      - check-dependency-rules
      - check-zepter
      - test-rust-features
      - check-toml-format
      - check-workspace
      - check-markdown
      - check-umbrella
      - check-fail-ci
      - check-readme
      - check-bootstrap-script
    if: always() && !cancelled()
    steps:
      - run: |
          tee resultfile <<< '${{ toJSON(needs) }}'
          FAILURES=$(cat resultfile | grep '"result": "failure"' | wc -l)
          if [ $FAILURES -gt 0 ]; then
            echo "### At least one required job failed ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo '### Good job! All the required jobs passed 🚀' >> $GITHUB_STEP_SUMMARY
          fi
