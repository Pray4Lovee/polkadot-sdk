name: Check the getting-started.sh script

on:
  pull_request:
    paths:
      - ".github/workflows/check-getting-started.yml"
      - "scripts/getting-started.sh"
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  isdraft:
    uses: ./.github/workflows/reusable-isdraft.yml

  check-getting-started:
    needs: isdraft
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: ubuntu
            container: ubuntu
            template: minimal
            shell: bash
          - name: debian
            container: debian
            template: parachain
            shell: sh
          - name: arch
            container: archlinux
            template: solochain
            shell: sh
          - name: fedora
            container: fedora
            template: parachain
            shell: sh
          - name: opensuse
            container: opensuse/tumbleweed
            template: solochain
            shell: sh
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install prerequisites
        run: |
          case "${{ matrix.name }}" in
            ubuntu|debian)
              apt update && apt install -y sudo git curl
              ;;
            arch)
              pacman -Syu --noconfirm && pacman -S --noconfirm sudo git curl
              ;;
            fedora)
              dnf install -y sudo git curl
              ;;
            opensuse)
              zypper install -y sudo git curl
              ;;
          esac

      - name: Run getting-started.sh in CI mode
        env:
          CI: "1"
        run: |
          ${{ matrix.shell }} scripts/getting-started.sh ${{ matrix.template }}

      - name: Compile the node
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.template }}-template
          cargo build --release
        timeout-minutes: 120

      - name: Check binary execution
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.template }}-template
          cargo run --release -- --help
        timeout-minutes: 5

  check-getting-started-windows:
    needs: isdraft
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - template: minimal
            shell: "C:\\Program Files\\Git\\bin\\bash.exe"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (Git Bash)
        run: |
          choco install -y rust git curl

      - name: Run getting-started.sh on Windows in CI
        env:
          CI: "1"
        shell: bash
        run: |
          "${{ matrix.shell }}" scripts/getting-started.sh ${{ matrix.template }}

      - name: Compile the node on Windows
        shell: bash
        run: |
          . "$HOME/.cargo/env"
          cd ${{ matrix.template }}-template
          cargo build --release
